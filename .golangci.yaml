version: "2"

run:
  timeout: 10m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: false

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
linters:
  enable:
    - revive
    - govet
    - misspell
    - gosec
    - staticcheck
    - ineffassign
    - unparam
    - errcheck
    - errorlint
    - gocyclo
    - dupl
    - unconvert
    - prealloc
    - unused
  settings:
    misspell:
      locale: US
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
