apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-exact
  namespace: namespace1
spec:
  ingressClassName: nginx
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /api/v1/users
        pathType: Exact
        backend:
          service:
            name: users-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
