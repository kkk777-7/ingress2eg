apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-tls-ingress1
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "namespace1/client-cert1"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "backend1.example.com"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-tls-ingress2
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "namespace1/client-cert2"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "backend2.example.com"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 443
