apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-tls-insecure
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "namespace1/client-cert"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 443
