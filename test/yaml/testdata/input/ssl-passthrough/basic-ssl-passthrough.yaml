apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ssl-passthrough-ingress
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - secure.example.com
    secretName: tls-secret
  rules:
  - host: secure.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: secure-service
            port:
              number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: secure-service
  namespace: namespace1
spec:
  ports:
  - port: 443
    targetPort: 8443
  selector:
    app: secure-app
