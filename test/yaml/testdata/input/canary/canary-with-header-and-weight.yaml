apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-ingress
  namespace: namespace1
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: production-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: canary-ingress
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: canary-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: production-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: canary-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
