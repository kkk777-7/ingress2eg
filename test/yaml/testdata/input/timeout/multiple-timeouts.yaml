apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timeout-ingress-1
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /slow-api
        pathType: Prefix
        backend:
          service:
            name: slow-api-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timeout-ingress-2
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /very-slow-api
        pathType: Prefix
        backend:
          service:
            name: very-slow-api-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: slow-api-service
  namespace: namespace1
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: slow-api
---
apiVersion: v1
kind: Service
metadata:
  name: very-slow-api-service
  namespace: namespace1
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: very-slow-api
