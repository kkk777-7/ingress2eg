apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timeout-ingress
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5s"
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: namespace1
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: api
