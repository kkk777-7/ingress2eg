apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://auth-service:8080/verify
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-User
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-ingress1
            port:
              number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: service-ingress1
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
