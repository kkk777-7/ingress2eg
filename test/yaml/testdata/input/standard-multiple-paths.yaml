apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-multi
  namespace: namespace1
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8080
      - path: /web
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 3000
      - path: /admin
        pathType: Exact
        backend:
          service:
            name: admin-service
            port:
              number: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: namespace1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9000
