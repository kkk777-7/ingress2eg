apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpc-ingress
  namespace: namespace1
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  rules:
  - host: grpc.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grpc-service
            port:
              number: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-service
  namespace: namespace1
spec:
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: grpc-server
