apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reliable-api
  namespace: production
  annotations:
    # Timeout settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # Retry settings
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.reliable.example.com
    secretName: reliable-api-tls
  rules:
  - host: api.reliable.example.com
    http:
      paths:
      - path: /slow
        pathType: Prefix
        backend:
          service:
            name: slow-backend-service
            port:
              number: 8080
      - path: /fast
        pathType: Prefix
        backend:
          service:
            name: fast-backend-service
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upload-api
  namespace: production
  annotations:
    # Extended timeout for file uploads
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"

    # Retry on errors
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
spec:
  ingressClassName: nginx
  rules:
  - host: upload.example.com
    http:
      paths:
      - path: /upload
        pathType: Prefix
        backend:
          service:
            name: upload-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: slow-backend-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: slow-backend
---
apiVersion: v1
kind: Service
metadata:
  name: fast-backend-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: fast-backend
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: upload
