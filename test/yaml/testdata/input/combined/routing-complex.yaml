apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-rewrite
  namespace: production
  annotations:
    # Rewrite target
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2

    # Use regex in paths
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /v1/legacy(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-service
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redirect-http-to-https
  namespace: production
  annotations:
    # Permanent redirect
    nginx.ingress.kubernetes.io/permanent-redirect: "https://app.example.com"
spec:
  ingressClassName: nginx
  rules:
  - host: old.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-redirect-with-code
  namespace: production
  annotations:
    # Temporal redirect
    nginx.ingress.kubernetes.io/temporal-redirect: "https://maintenance.example.com"
    nginx.ingress.kubernetes.io/temporal-redirect-code: "302"
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /maintenance
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regex-path-routing
  namespace: production
  annotations:
    # Use regex for complex routing
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /api/v[0-9]+/users
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /api/v[0-9]+/products
        pathType: ImplementationSpecific
        backend:
          service:
            name: product-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: api
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: user
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: product
