apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: namespace1
spec:
  gatewayClassName: eg
  listeners:
  - hostname: example.com
    name: example-com-http
    port: 80
    protocol: HTTP
status: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-tls-ingress-example-com
  namespace: namespace1
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: backend-tls-ingress-example-com-backend-service1
    matches:
    - path:
        type: PathPrefix
        value: /api
    name: rule-0-prefix-api
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: backend-tls-ingress-example-com-backend-service2
    matches:
    - path:
        type: PathPrefix
        value: /admin
    name: rule-1-prefix-admin
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: backend-tls-ingress-example-com-backend-service3
    matches:
    - path:
        type: PathPrefix
        value: /web
    name: rule-2-prefix-web
status:
  parents: []
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-tls-ingress-example-com-backend-service1
  namespace: namespace1
spec:
  endpoints:
  - fqdn:
      hostname: backend-service1.namespace1.svc.cluster.local
      port: 443
  tls:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: client-cert
    clientCertificateRef:
      group: ""
      kind: Secret
      name: client-cert
      namespace: namespace1
    sni: backend.example.com
status: {}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-tls-ingress-example-com-backend-service2
  namespace: namespace1
spec:
  endpoints:
  - fqdn:
      hostname: backend-service2.namespace1.svc.cluster.local
      port: 443
  tls:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: client-cert
    clientCertificateRef:
      group: ""
      kind: Secret
      name: client-cert
      namespace: namespace1
    sni: backend.example.com
status: {}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-tls-ingress-example-com-backend-service3
  namespace: namespace1
spec:
  endpoints:
  - fqdn:
      hostname: backend-service3.namespace1.svc.cluster.local
      port: 443
  tls:
    caCertificateRefs:
    - group: ""
      kind: Secret
      name: client-cert
    clientCertificateRef:
      group: ""
      kind: Secret
      name: client-cert
      namespace: namespace1
    sni: backend.example.com
status: {}
