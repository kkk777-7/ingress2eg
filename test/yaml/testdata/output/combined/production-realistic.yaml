  ancestors: null
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: canary-deployment-api-example-com-0
  namespace: production
spec:
  basicAuth:
    users:
      group: ""
      kind: Secret
      name: api-auth-secret
      namespace: production
  cors:
    allowCredentials: true
    allowHeaders:
    - Authorization
    - Content-Type
    - X-Request-ID
    - X-Correlation-ID
    allowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    allowOrigins:
    - https://app.example.com
    - https://admin.example.com
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: canary-deployment-api-example-com
    sectionName: rule-0-prefix-v2-canary-header
status:
  ancestors: null
