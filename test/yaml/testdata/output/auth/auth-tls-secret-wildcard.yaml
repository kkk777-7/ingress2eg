apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: namespace1
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: null
        kind: null
        name: tls-secret
status: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-ingress-all-hosts
  namespace: namespace1
spec:
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: service-ingress1
      port: 443
    matches:
    - path:
        type: PathPrefix
        value: /
    name: rule-0-prefix-root
status:
  parents: []
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: nginx-1
  namespace: namespace1
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: nginx
    sectionName: https
  tls:
    clientValidation:
      caCertificateRefs:
      - group: ""
        kind: Secret
        name: ca-secret
        namespace: namespace1
status:
  ancestors: null
