apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: namespace1
spec:
  gatewayClassName: eg
  listeners:
  - hostname: '*.example.com'
    name: example-com-http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TLSRoute
      namespaces:
        from: Same
    hostname: '*.example.com'
    name: example-com-tls
    port: 443
    protocol: TLS
    tls:
      mode: Passthrough
status: {}
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: TLSRoute
metadata:
  name: ssl-passthrough-wildcard-ingress-example-com
  namespace: namespace1
spec:
  hostnames:
  - '*.example.com'
  parentRefs:
  - name: nginx
    sectionName: example-com-tls
  rules:
  - backendRefs:
    - name: wildcard-service
      port: 443
    name: rule-0-prefix-root
status:
  parents: null
