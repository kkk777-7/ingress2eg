apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: namespace1
spec:
  gatewayClassName: nginx
  listeners:
  - hostname: example.com
    name: example-com-http
    port: 80
    protocol: HTTP
status: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-admin-ingress-example-com
  namespace: namespace1
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: canary-admin-service
      port: 80
    matches:
    - headers:
      - name: X-Canary
        type: Exact
        value: always
      path:
        type: PathPrefix
        value: /admin
    name: rule-prefix-admin-canary-header-always
  - backendRefs:
    - name: production-admin-service
      port: 80
    matches:
    - headers:
      - name: X-Canary
        type: Exact
        value: never
      path:
        type: PathPrefix
        value: /admin
    name: rule-prefix-admin-canary-header-never
  - backendRefs:
    - name: canary-admin-service
      port: 80
      weight: 10
    - name: production-admin-service
      port: 80
      weight: 90
    matches:
    - path:
        type: PathPrefix
        value: /admin
    name: rule-prefix-admin
  - backendRefs:
    - name: canary-api-service
      port: 80
      weight: 20
    - name: production-api-service
      port: 80
      weight: 80
    matches:
    - path:
        type: PathPrefix
        value: /api
    name: rule-prefix-api
status:
  parents: []
