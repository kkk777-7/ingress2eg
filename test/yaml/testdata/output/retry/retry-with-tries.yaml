apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: namespace1
spec:
  gatewayClassName: nginx
  listeners:
  - hostname: example.com
    name: example-com-http
    port: 80
    protocol: HTTP
status: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: retry-ingress-example-com
  namespace: namespace1
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: api-service
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /api
    name: rule-prefix-api
status:
  parents: []
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: retry-ingress-example-com
  namespace: namespace1
spec:
  retry:
    numRetries: 3
    retryOn:
      httpStatusCodes:
      - 502
      - 503
      triggers:
      - connect-failure
      - refused-stream
      - reset
      - reset-before-request
      - retriable-status-codes
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: retry-ingress-example-com
status:
  ancestors: null
