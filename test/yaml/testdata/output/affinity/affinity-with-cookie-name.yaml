apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx
  namespace: namespace1
spec:
  gatewayClassName: eg
  listeners:
  - hostname: example.com
    name: example-com-http
    port: 80
    protocol: HTTP
status: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affinity-ingress-example-com
  namespace: namespace1
spec:
  hostnames:
  - example.com
  parentRefs:
  - name: nginx
  rules:
  - backendRefs:
    - name: api-service
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /api
    name: rule-0-prefix-api
status:
  parents: []
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: affinity-ingress-example-com
  namespace: namespace1
spec:
  loadBalancer:
    consistentHash:
      cookie:
        name: MY_COOKIE
      type: Cookie
    type: ConsistentHash
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: affinity-ingress-example-com
status:
  ancestors: null
