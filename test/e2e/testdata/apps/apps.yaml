---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress2eg
---
############################################
## Stable resources
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: ingress2eg
  labels:
    app: echo-server
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-server
      version: stable
  template:
    metadata:
      labels:
        app: echo-server
        version: stable
    spec:
      containers:
      - name: echo-server
        image: ealen/echo-server:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: VERSION
          value: "stable"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: ingress2eg
  labels:
    app: echo-server
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: echo-server
    version: stable
---
############################################
## Canary resources
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server-canary
  namespace: ingress2eg
  labels:
    app: echo-server
    version: canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-server
      version: canary
  template:
    metadata:
      labels:
        app: echo-server
        version: canary
    spec:
      containers:
      - name: echo-server
        image: ealen/echo-server:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: VERSION
          value: "canary"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server-canary
  namespace: ingress2eg
  labels:
    app: echo-server
    version: canary
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: echo-server
    version: canary
---
############################################
## Timeout resources
############################################
apiVersion: v1
kind: Service
metadata:
  name: slow-backend
  namespace: ingress2eg
spec:
  ports:
  - port: 8080
    protocol: TCP
    name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: slow-backend-1
  namespace: ingress2eg
  labels:
    kubernetes.io/service-name: slow-backend
addressType: IPv4
endpoints:
- addresses:
  - "192.0.2.1"  # TEST-NET-1: unreachable IP for timeout testing
ports:
- name: http
  port: 8080
  protocol: TCP