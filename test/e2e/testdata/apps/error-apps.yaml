apiVersion: v1
kind: Service
metadata:
  name: error-backend
  namespace: ingress2eg
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: error-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-backend
  namespace: ingress2eg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: error-backend
  template:
    metadata:
      labels:
        app: error-backend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: error-backend-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: error-backend-config
  namespace: ingress2eg
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 8080;

        # Return 503 for the first 2 requests, then 200
        location / {
          default_type application/json;

          # Use nginx variable to track request count (simplified)
          # In real scenario, this returns 503 randomly or based on backend state
          return 503 '{"error": "Service Unavailable", "status": 503}';
        }

        # Endpoint that always returns 200
        location /healthy {
          return 200 '{"status": "ok"}';
        }
      }
    }
